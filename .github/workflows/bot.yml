name: rubika-bot

# ربات هر بار ~۵ ساعت و ۴۰ دقیقه اجرا می‌شود؛ با کرون هر ۵ دقیقه اجرای بعدی در صف
# می‌ماند و بلافاصله پس از پایان اجرای فعلی شروع می‌شود.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: rubika-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: بررسی Secret و ساخت فایل .env
        run: |
          if [ -z "${{ secrets.RUBIKA_BOT_TOKEN }}" ]; then
            echo "::notice::Secret به نام RUBIKA_BOT_TOKEN تنظیم نشده؛ این اجرا رد شد."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            printf 'RUBIKA_BOT_TOKEN=%s\n' '${{ secrets.RUBIKA_BOT_TOKEN }}'
            printf 'RUBIKA_CHANNEL=%s\n' 'Pari_Movies'
            printf 'ADMIN_CHAT_ID=%s\n' 'b0IimI80BNIx0f8113255707d3388b93'
          } > .env

      - name: نصب پیش‌نیازها
        if: env.SKIP != '1'
        run: pip install -r requirements.txt

      - name: تست دسترسی به روبیکا
        if: env.SKIP != '1'
        run: |
          set -a; . ./.env; set +a
          python - <<'PY'
          import os, requests
          t = os.environ["RUBIKA_BOT_TOKEN"]
          r = requests.post(f"https://botapi.rubika.ir/v3/{t}/getMe", timeout=30)
          print("HTTP", r.status_code, r.text[:300])
          r.raise_for_status()
          if r.json().get("status") != "OK":
              raise SystemExit("ربات به API روبیکا دسترسی ندارد")
          PY

      - name: اجرای ربات
        if: env.SKIP != '1'
        env:
          MAX_RUNTIME_SECONDS: "20400"
        run: python rubika_bot.py

      - name: ذخیرهٔ وضعیت (offset و آمار)
        if: always() && env.SKIP != '1'
        run: |
          git config user.name "pari-movies-bot"
          git config user.email "bot@users.noreply.github.com"
          touch .rubika_offset
          git add -f .rubika_offset .bot_stats.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ربات: به‌روزرسانی وضعیت آخرین پیام و آمار"
          git push || echo "::warning::ذخیرهٔ وضعیت در ریپو ناموفق بود (فیلتر پیام قدیمی جایگزین آن است)"
